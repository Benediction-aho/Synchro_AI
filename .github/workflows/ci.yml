name: CI

on:
  push:
    paths:
      - "SYNCHRO/backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "SYNCHRO/backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SYNCHRO/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: SYNCHRO/backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q --deselect tests/test_deriv_live.py::test_live_tick_stream

      - name: Security audit (dependencies)
        run: |
          pip install pip-audit
          pip-audit --skip-editable || true
