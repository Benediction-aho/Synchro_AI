name: SYNCHRO CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ============================================================
  # Backend Tests
  # ============================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SYNCHRO/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: SYNCHRO/backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q --deselect tests/test_deriv_live.py::test_live_tick_stream

      - name: Security audit (dependencies)
        run: |
          pip install pip-audit
          pip-audit --skip-editable || true

      - name: Type check
        run: |
          pip install mypy
          mypy src/synchro --ignore-missing-imports || true

  # ============================================================
  # Frontend Tests & Build
  # ============================================================
  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SYNCHRO/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: SYNCHRO/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: SYNCHRO/frontend/dist/
          retention-days: 7

  # ============================================================
  # MQL5 Bridge Tests
  # ============================================================
  bridge-test:
    name: MQL5 Bridge Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SYNCHRO/mql5_bridge/bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio boto3 pydantic pydantic-settings cryptography

      - name: Run bridge tests
        run: pytest -q

  # ============================================================
  # Security Scans
  # ============================================================
  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run OWASP ZAP baseline scan
        if: github.event_name == 'workflow_dispatch'
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'https://staging-api.synchro.trade'

  # ============================================================
  # Docker Build & Push
  # ============================================================
  docker-build:
    name: Build & Push Docker Images
    needs: [backend-test, frontend-test, bridge-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        working-directory: SYNCHRO/backend
        run: |
          docker build -t $ECR_REGISTRY/synchro-backend:${{ github.sha }} .
          docker push $ECR_REGISTRY/synchro-backend:${{ github.sha }}
          docker tag $ECR_REGISTRY/synchro-backend:${{ github.sha }} $ECR_REGISTRY/synchro-backend:latest
          docker push $ECR_REGISTRY/synchro-backend:latest

      - name: Build & push data-ingestion
        working-directory: SYNCHRO/backend
        run: |
          docker build -f Dockerfile.data-ingestion -t $ECR_REGISTRY/synchro-data-ingestion:${{ github.sha }} .
          docker push $ECR_REGISTRY/synchro-data-ingestion:${{ github.sha }}

      - name: Build & push learning-worker
        working-directory: SYNCHRO/backend
        run: |
          docker build -f Dockerfile.learning-worker -t $ECR_REGISTRY/synchro-learning-worker:${{ github.sha }} .
          docker push $ECR_REGISTRY/synchro-learning-worker:${{ github.sha }}

      - name: Build & push evolution-worker
        working-directory: SYNCHRO/backend
        run: |
          docker build -f Dockerfile.evolution-worker -t $ECR_REGISTRY/synchro-evolution-worker:${{ github.sha }} .
          docker push $ECR_REGISTRY/synchro-evolution-worker:${{ github.sha }}

      - name: Build & push bridge
        working-directory: SYNCHRO/mql5_bridge/bridge
        run: |
          docker build -t $ECR_REGISTRY/synchro-bridge:${{ github.sha }} .
          docker push $ECR_REGISTRY/synchro-bridge:${{ github.sha }}

  # ============================================================
  # Terraform Plan
  # ============================================================
  terraform-plan:
    name: Terraform Plan
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: SYNCHRO/infra/terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: SYNCHRO/infra/terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: SYNCHRO/infra/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: SYNCHRO/infra/terraform
        run: |
          terraform plan \
            -var="environment=staging" \
            -var="image_tag=${{ github.sha }}" \
            -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: SYNCHRO/infra/terraform/tfplan
          retention-days: 7

  # ============================================================
  # Deploy Staging (Manual Approval)
  # ============================================================
  deploy-staging:
    name: Deploy Staging
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: SYNCHRO/infra/terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: SYNCHRO/infra/terraform
        run: terraform apply -auto-approve tfplan

      - name: Run post-deploy smoke tests
        run: |
          sleep 30
          curl -f https://staging-api.synchro.trade/health || exit 1
          curl -f https://staging-api.synchro.trade/api/v1/health || exit 1

  # ============================================================
  # Deploy Production (Manual Approval)
  # ============================================================
  deploy-production:
    name: Deploy Production
    needs: deploy-staging
    if: github.event.inputs.deploy_target == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: SYNCHRO/infra/terraform
        run: terraform init

      - name: Terraform Plan (Production)
        working-directory: SYNCHRO/infra/terraform
        run: |
          terraform plan \
            -var="environment=production" \
            -var="image_tag=${{ github.sha }}" \
            -out=tfplan-prod

      - name: Terraform Apply (Production)
        working-directory: SYNCHRO/infra/terraform
        run: terraform apply -auto-approve tfplan-prod

      - name: Run post-deploy smoke tests
        run: |
          sleep 30
          curl -f https://api.synchro.trade/health || exit 1
          curl -f https://api.synchro.trade/api/v1/health || exit 1

      - name: Notify deployment
        run: |
          echo "Production deployment complete!" 
          # Add Slack/Discord webhook here