[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "synchro-backend"
version = "0.1.0"
description = "SYNCHRO trading agent - cloud backend monorepo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "psycopg[binary]>=3.2",
    "websockets>=13",
    "redis>=5",
    "numpy>=1.26",
    "cryptography>=43",
    "celery[redis]>=5.4",
    "aiogram>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
